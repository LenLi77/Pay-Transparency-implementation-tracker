<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- EU Flag circle -->
  <circle cx="600" cy="120" r="50" fill="#003399"/>
  <text x="600" y="135" text-anchor="middle" font-size="60" fill="#FFCC00">★</text>
  
  <!-- Title -->
  <text x="600" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white">EU Pay Transparency Directive</text>
  
  <!-- Subtitle -->
  <text x="600" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="rgba(255,255,255,0.9)">Implementation Tracker • All 27 Member States</text>
  
  <!-- Stats boxes -->
  <!-- Green -->
  <rect x="200" y="310" width="200" height="120" rx="16" fill="rgba(255,255,255,0.1)"/>
  <text x="300" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#4ade80">10</text>
  <text x="300" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">Draft Published</text>
  
  <!-- Yellow -->
  <rect x="500" y="310" width="200" height="120" rx="16" fill="rgba(255,255,255,0.1)"/>
  <text x="600" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#fbbf24">7</text>
  <text x="600" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">Partial / Expected</text>
  
  <!-- Red -->
  <rect x="800" y="310" width="200" height="120" rx="16" fill="rgba(255,255,255,0.1)"/>
  <text x="900" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#f87171">10</text>
  <text x="900" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">No Info Currently</text>
  
  <!-- Deadline badge -->
  <rect x="400" y="470" width="400" height="60" rx="12" fill="rgba(220,38,38,0.9)"/>
  <text x="600" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="white">⏰ Deadline: 7 June 2026</text>
  
  <!-- Baltic badge -->
  <text x="1140" y="600" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)">🇪🇪🇱🇻🇱🇹 Baltic Focus</text>
</svg>
