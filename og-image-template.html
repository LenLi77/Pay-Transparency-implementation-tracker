<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      color: white;
    }
    .flags {
      font-size: 48px;
      margin-bottom: 24px;
      letter-spacing: 8px;
    }
    h1 {
      font-size: 56px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 16px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }
    .subtitle {
      font-size: 28px;
      opacity: 0.9;
      margin-bottom: 40px;
    }
    .stats {
      display: flex;
      gap: 40px;
      margin-bottom: 40px;
    }
    .stat {
      text-align: center;
      padding: 20px 32px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    .stat-number {
      font-size: 48px;
      font-weight: 800;
    }
    .stat-number.green { color: #4ade80; }
    .stat-number.yellow { color: #fbbf24; }
    .stat-number.red { color: #f87171; }
    .stat-label {
      font-size: 16px;
      opacity: 0.8;
      margin-top: 4px;
    }
    .deadline {
      background: rgba(220, 38, 38, 0.9);
      padding: 16px 40px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 600;
    }
    .baltic {
      position: absolute;
      bottom: 40px;
      right: 60px;
      font-size: 18px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="flags">🇪🇺 🇸🇪 🇱🇹 🇫🇮 🇩🇪 🇫🇷 🇮🇹 🇪🇸 🇵🇱</div>
  <h1>EU Pay Transparency Directive</h1>
  <div class="subtitle">Implementation Tracker • All 27 Member States</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-number green">10</div>
      <div class="stat-label">Draft Published</div>
    </div>
    <div class="stat">
      <div class="stat-number yellow">7</div>
      <div class="stat-label">Partial / Expected</div>
    </div>
    <div class="stat">
      <div class="stat-number red">10</div>
      <div class="stat-label">No Info Currently</div>
    </div>
  </div>
  <div class="deadline">⏰ Deadline: 7 June 2026</div>
  <div class="baltic">🇪🇪🇱🇻🇱🇹 Baltic Countries Specialist</div>
</body>
</html>
